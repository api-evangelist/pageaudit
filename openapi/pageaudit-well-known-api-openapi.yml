openapi: 3.2.0
info:
  title: PageAudit .well Known API
  version: f5ac3ca0
  description: 'Technical SEO auditor that ships the fix. Main client: AI agents. Browsable index at GET /api/.'
servers:
- url: https://pageaudit.online
tags:
- name: .well Known
paths:
  /.well-known/{arquivo}:
    get:
      operationId: get_well_known_by_arquivo
      summary: 'Machine discovery before the home page: `api-catalog` (RFC 9727, a linkset with…'
      description: 'Returns: `application/linkset+json` for the api-catalog; `text/plain` for the other two.'
      security: []
      parameters:
      - name: arquivo
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '`application/linkset+json` for the api-catalog; `text/plain` for the other two.'
        '404':
          description: Name outside the four published.
      tags:
      - .well Known
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Guest token (`POST /api/guest`) in `X-Guest-Token: pa_…`, `Authorization: Bearer pa_…` or `?guest_token=pa_…`. A user session (`sess_…`) also works and takes precedence.'
