- name: tab_history
  description: The tab's previous runs and what changed between each one and the one before it (score
    delta, findings that appeared and that disappeared). Every run has always been kept; this is where
    you read the series. Each entry carries the score, the counts and a `change` with the point delta
    and the findings that appeared (`broke`) or disappeared (`fixed`) since the previous run — compared
    by finding code, never by message. Runs older than the watch feature are matched by URL.
- name: watch_tab
  description: 'Turns the daily watch on or off for a tab: it re-audits the page once a day and e-mails
    when the score drops or a new error/warning appears. Needs the signed-in account (its browser session
    cookie); a guest token gets 403 `account_required`. With `monitor: true` the page is re-audited once
    a day and an e-mail goes out when the score drops or a new error/warning appears — never on an improvement.
    Watching needs an account (the alert has to reach someone) and each account watches a limited number
    of pages.'
- name: lab_test
  description: 'Starts a lab test of an audit''s page: Lighthouse run by Google PageSpeed Insights (performance,
    accessibility, best practices, SEO). Answers 202 at once; the test takes ~25 s to 2+ minutes — then
    read it with lab_result. Does not change the audit score. Answers **202** at once; the test runs for
    ~25 s to over 2 minutes and its summary is stored in the audit (`summary.lab.<strategy>`), so it comes
    back in `GET /api/audits/:id`, in the tab and in the shared report. It does not change the audit score.
    Calling again while the same strategy is running does not start a second test. Limits: 4 tests at
    a time on the server, 6 per network per hour and 500 per day for the whole product.'
- name: lab_result
  description: 'The lab tests of an audit (mobile and desktop): running, finished with scores, metrics
    and biggest savings, or failed. With wait (up to 25) it answers as soon as a running test finishes.
    Long-poll: with `wait` the answer comes as soon as a running test finishes, or after `wait` seconds
    with `status: running`. Repeat until it is not running.'
- name: get_audit
  description: Re-reads an audit already made, with `fixes` (the ready fix for each finding).
  inputSchema:
    type: object
    properties:
      guest_token:
        type: string
      id:
        type: string
        description: Audit ID, from `Audit.id`.
    required:
    - guest_token
    - id
  source_operation: openapi/pageaudit-openapi.json#get_audit
- name: get_patch
  description: 'The consolidated patch of an audit: <head> block to paste, files to create and templates
    with placeholders. No model — only facts from the page. Each finding becomes a fix in one of three
    classes: `deterministico` (comes whole from what the page declares: final URL, title, description,
    OG), `molde` (a tag with a marked placeholder, like `{{TITULO}}`, and the suggested source) or `sem_patch`
    (a decision or infrastructure, with the instruction). Nothing is invented by a model.'
  inputSchema:
    type: object
    properties:
      guest_token:
        type: string
      id:
        type: string
        description: Audit ID, from `Audit.id`.
    required:
    - guest_token
    - id
  source_operation: openapi/pageaudit-openapi.json#get_patch
- name: get_badge
  description: Metadata and markdown of the SVG badge of a shared report.
  inputSchema:
    type: object
    properties:
      slug:
        type: string
        description: 24-char public slug
    required:
    - slug
  source_operation: openapi/pageaudit-openapi.json#get_badge
- name: embed_snippet
  description: The embeddable widget's snippet, already assembled with the site's name and colour — one
    script tag, no account, no lead capture. One script tag puts the audit form on your own site, with
    your name and colour, and no account or key. Send the same query you would send to `/embed` and the
    answer comes back with `snippet` already assembled. The widget never asks the visitor for an e-mail.
- name: contact
  description: 'Write to the people behind the product: a question, or a sponsorship/partnership/advertising
    proposal. One route for a question and for a sponsorship, partnership or ad proposal (`tipo`, with
    the placements of `GET /api/partners`). One message every 10 seconds per network: one that arrives
    sooner waits its turn and then goes out — no error. The message reaches the team by e-mail, with `email`
    as the reply address. For voice, send multipart/form-data: `dados` is this JSON (up to 32 KiB), and
    `audio` is one WebM, Ogg or M4A audio file (up to 2 MB). Audio can replace message. The browser records
    up to two minutes. Audio is attached to the owner''s e-mail.'
  inputSchema:
    type: object
    properties:
      name:
        type: string
        description: What to call the person writing.
      email:
        type: string
        description: Where to reply.
      message:
        type: string
        description: What you want to say.
      form_ts:
        type: number
        description: Date.now() of when the form opened (≥2s ago)
    required:
    - name
    - email
    - message
    - form_ts
  source_operation: openapi/pageaudit-openapi.json#contact
