- name: audit_url
  description: 'Check a web page''s search metadata, crawl access, structured data and selected discovery
    files. Return evidence, limits and suggested changes without creating a saved tab. A blocked target
    returns HTTP 502 with target_blocked. The report does not certify security or accessibility. This
    is the product for agents. The free alternative: a person signs in with an account to get the trial.'
  inputSchema:
    type: object
    properties:
      url:
        type: string
        description: absolute URL to audit
      guest_token:
        type: string
        description: optional pa_…
    required:
    - url
  source_operation: openapi/pageaudit-openapi.json#audit_url
- name: create_guest
  description: 'Creates a guest token pa_… for the tab workspace. Keep the token: it is the identity of
    the tabs and of the audits tied to them.'
  inputSchema:
    type: object
    properties: {}
  source_operation: openapi/pageaudit-openapi.json#create_guest
- name: list_tabs
  description: Lists the owner's saved pages (guest or session), with the active page's last report. Group
    pages by site to match the Projects table. One call loads the saved pages and the active page's last
    report. The UI groups pages by site in Projects and opens each site in a work tab. The introduction
    stays in Welcome. A signed-in account sends `X-Organization-Id`; a guest has one temporary workspace.
  inputSchema:
    type: object
    properties:
      guest_token:
        type: string
    required:
    - guest_token
  source_operation: openapi/pageaudit-openapi.json#list_tabs
- name: create_tab
  description: Opens a saved URL. Set queue_audit=false to monitor a discovered origin without a page
    audit.
  inputSchema:
