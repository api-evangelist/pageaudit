tools:
- name: list_sites
  description: Read up to 50 sites owned by the signed-in account. Follow next_cursor.
- name: add_site
  description: Add a site to the account. No site count limit. An account holds up to 1,000 sites (409
    site_limit). The existing guest audit workspace stays separate.
- name: get_site
  description: Read one site owned by the signed-in account.
- name: search_console
  description: Read the site's last good 28-day sample, partial coverage, dates and collection failure.
    The sample covers 28 days, at most 50 queries and 50 pages. Coverage is partial. It is not a traffic
    total or a ranking promise. Credentials and raw provider responses are not returned.
- name: connect_search_console
  description: Start read-only Google consent. The account owner must follow redirect in their browser.
    Follow redirect in the account's browser. Consent expires after five minutes. The callback is single-use
    and bound to the account and site. The property must match the site and Google must authorize it before
    the connection is saved.
- name: sync_search_console
  description: Collect a due sample. Repeated calls cannot bypass the daily reservation. The hourly schedule
    uses the same durable reservation. A failure preserves the last good sample and schedules the next
    attempt 24 hours later. This route cannot force an extra collection.
- name: disconnect_search_console
  description: Remove the local Google credential and stop collection. Keep the last good sample. The
    last good sample stays available. An in-flight callback or collection cannot reconnect the site.
- name: weekly_site_report
  description: 'Read the weekly report of a site: what changed since last week, the new pages of up to
    3 competitors and every finding. Reading never runs the report. Once a week the report checks the
    first 500 URLs of the site''s sitemap, says what changed since the week before (new and fixed problems,
    new pages) and lists the new pages of up to 3 competitor sitemaps. Reading never runs the report.'
- name: save_weekly_site_report
  description: Turn the weekly report of a site on or off and set up to 3 competitors. Turning on needs
    a watch package in force. Turning on needs a watch package in force and a free site in it (409 with
    `limit` and `plans` otherwise). The first report runs right away; later ones run a week after the
    last. A new competitor gets its base this week and its new pages from the next. Saves use the expected
    version.
- name: weekly_site_report_history
  description: Read one weekly report of a site's history by its id.
- name: ai_search_visibility
  description: 'Check whether the site''s page appears in the DeepSeek AI search for each target search,
    at which position, and which sites appear in its place, with plain recommendations. Uses the saved
    searches or the ones the page suggests when queries is omitted. Send {} to use the saved searches,
    or the searches the page title and H1 suggest; send {queries} to choose. One index check plus one
    search per query, each USD 0.00075 when it returns results. Without a watch package: one run per week,
    three searches. With one: twenty runs per UTC day, ten searches. Result titles and snippets are third-party
    data.'
- name: ai_search_history
  description: 'Read the plan, the saved searches, the last runs and the position trend of each search.
    Reads never call the search engine. The trend compares each search of the newest run with the previous
    run that had it: up, down, same, new or lost.'
- name: save_ai_search_queries
  description: Save up to ten searches for the weekly report to track (three without a watch package).
    Saves use the expected version. Without a current watch package, an account tracks up to three searches.
    Uses the shared 240 writes per site and UTC day.
- name: journeys
  description: Read the owned site's installation, actions, paths and ordered conversion funnel for the
    last seven days. Requires the account's browser session. Only this site's owner can read it. Data
    updates through the shared realtime transport. No user identity, typed text or screen recording.
- name: connection_review
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Read today's
    private TLS review without starting a scan. One review per account, organization, origin and UTC day.
    Starting requires current domain monitoring rights. The account has three starts per UTC day. Retries
    return the same review. The scanner samples one public IP, with three stages and a 170-second deadline.
    Partial results do not establish safety. GET never starts a scan. The shared realtime channel reports
    stage changes. Reports expire after 26 hours.
- name: review_connection
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Start a TLS
    review of the saved HTTPS origin using current domain monitoring rights. At most three starts per
    account and UTC day, one per site. A repeated request reuses today's review. Do not claim complete
    safety from a partial result. One review per account, organization, origin and UTC day. Starting requires
    current domain monitoring rights. The account has three starts per UTC day. Retries return the same
    review. The scanner samples one public IP, with three stages and a 170-second deadline. Partial results
    do not establish safety. GET never starts a scan. The shared realtime channel reports stage changes.
    Reports expire after 26 hours.
- name: cancel_connection_review
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Cancel the
    current TLS review and preserve completed evidence. One review per account, organization, origin and
    UTC day. Starting requires current domain monitoring rights. The account has three starts per UTC
    day. Retries return the same review. The scanner samples one public IP, with three stages and a 170-second
    deadline. Partial results do not establish safety. GET never starts a scan. The shared realtime channel
    reports stage changes. Reports expire after 26 hours.
- name: domain_portfolio
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Read cached
    domain monitoring and deadlines for selected saved pages. Does not start external collection or activate
    monitoring. Every tab must belong to the current account and organization. Repeat with the next group
    of IDs for a larger workspace.
- name: preview_domain_alerts
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Review the
    exact selected domains before changing renewal notices. Select up to 25 saved pages. Repeated registrable
    domains count once. The server checks the account, organization and current revisions again. A stale
    preview changes nothing.
- name: apply_domain_alerts
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Apply the
    reviewed selection. Requires the preview from preview_domain_alerts. A stale preview changes nothing.
    Select up to 25 saved pages. Repeated registrable domains count once. The server checks the account,
    organization and current revisions again. A stale preview changes nothing.
- name: domain_status
  description: Read registration, contact visibility, TLS, DNS, CAA, mail policies, certificate issuance
    and a limited server comparison. Read source dates and collection gaps. Private options require the
    account session. A discovered name never starts monitoring automatically. Pages share public observations
    by registry domain and HTTPS origin. Private settings and history stay with the account and organization.
    Missing data is not a healthy result.
- name: check_domain
  description: Refresh due registration, contacts, TLS, DNS, mail policies, certificate issuance and a
    limited DNS/TLS sample. Reuses fresh public data. Reuse fresh observations. A failed or partial query
    preserves the last complete observation and its date. Up to 100 cold page reads per owner and UTC
    day.
- name: set_domain_expiry
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Set or remove
    the private manual expiry. Send manual_expires_on, dns, or both. Omitted settings are preserved. DNS
    requires both selectors and rotating_addresses. An identical retry is idempotent. A conflicting revision
    returns 409.
- name: configure_domain_dns
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Set up to
    three known DKIM selectors and choose whether IP rotation is expected. Expected rotation keeps history
    without notices; alias changes still notify. Does not discover selectors, enable monitoring or authenticate
    sent messages. Send manual_expires_on, dns, or both. Omitted settings are preserved. DNS requires
    both selectors and rotating_addresses. An identical retry is idempotent. A conflicting revision returns
    409.
- name: configure_domain_monitor
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Enable or
    stop domain monitoring, or pause notices for maintenance. Count a registry domain once per account,
    including its organization copies. Add only the tab's origin. HTTP receives DNS checks only. Maintenance
    pauses notices while collection continues. Confirm enabled, no suspension and next_check_at after
    saving.
- name: domain_history
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Read up to
    50 private incidents with notice delivery. Send the last event number as before for the next page.
    A first observed risk is an initial incident, not evidence of an external change. The first DNS and
    certificate-issuance snapshots are silent baselines. DNS changes, incompatible server samples and
    connection failures need two distinct observations. Expected IP rotation is silent. Repeated observations
    do not duplicate a notice. Contact changes expose field states only. Issuance does not prove installation.
    DNS records do not prove authentication of sent mail.
- name: acknowledge_domain_event
  description: Requires the account session, current X-Organization-Id and CSRF for writes. Acknowledge
    an expected event. Suppress its notice only if sending has not started. Preserve the event and its
    evidence. Preserve the event and observation. Acknowledgement does not erase a confirmed risk or retract
    a sent notice. Repetition is idempotent.
- name: audit_site
  description: 'Check the first 20 URLs of a site''s sitemap: status, redirects, robots.txt, noindex,
    canonical, titles and descriptions. Free, without an account. The same site within one hour returns
    the stored sample. URLs of another host are counted, never requested. The free sample of the SEO audit.
    URLs of another host are counted, never requested. The same site within one hour returns the stored
    sample (`cached_at`) without requesting the site again and without spending the allowance.'
- name: check_ai_access
  description: 'Request a page as Googlebot, Bingbot and the AI crawlers (OAI-SearchBot, Claude-SearchBot,
    PerplexityBot, ChatGPT-User, GPTBot, ClaudeBot) and see who gets a 403, a 429 or a firewall challenge
    that robots.txt does not show. Also returns the date of the newest sitemap lastmod and whether Cloudflare
    is in front. Free, without an account. The same page within one hour returns the stored result. The
    page is requested with the published user agent of Googlebot, Bingbot, OAI-SearchBot, Claude-SearchBot,
    PerplexityBot, ChatGPT-User, GPTBot, ClaudeBot, and once as a browser. A 403, a 429 or a firewall
    challenge that only a crawler gets is the block that robots.txt does not show. The sitemap is the
    one that robots.txt declares, or `/sitemap.xml`; it is stale when its newest `lastmod` is more than
    30 days old. Limit: Cloudflare recognises the real crawler by its IP address, so a rule that trusts
    verified bots can treat the real crawler differently. The same page within one hour returns the stored
    result (`cached_at`) without requesting the site again.'
